<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05060d" />
  <title>FLUX</title>
  <link rel="stylesheet" href="styles.css?v=16" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="vignette"></div>

  <div id="hud">
    <div id="score">0</div>
    <div id="combo"></div>
    <div id="best-row"><span id="best">0</span> <span class="lbl">BEST</span></div>
  </div>

  <div id="result" class="hidden">
    <div class="card">
      <div id="result-badge">CRASH</div>
      <div id="result-score">0</div>
      <div class="rsub">GATES</div>
      <div id="result-best">Best 0</div>
      <button id="btn-again" class="again">TAP TO RETRY</button>
    </div>
  </div>

  <div id="start">
    <div class="launch">
      <div id="flux-dots"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="name">FLUX</div>
      <div class="sub"><b>Tap</b> to change your colour.<br/>Match the rushing gate's colour to fly through.<br/>Wrong colour = <b>crash</b>. It gets faster every gate.</div>
      <div class="tap">Tap to start</div>
      <div id="err"></div>
    </div>
    <div id="ver">build v16</div>
  </div>

  <script type="module" src="src/main.js?v=16"></script>
</body>
</html>
