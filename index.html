<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#121a38" />
  <title>SWING · STACK</title>
  <link rel="stylesheet" href="styles.css?v=19" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="vignette"></div>

  <div id="hud">
    <div id="score">0</div>
    <div id="best-row"><span id="best">0</span> <span class="lbl">BEST</span></div>
  </div>

  <div id="result" class="hidden">
    <div class="card">
      <div id="result-badge">GAME OVER</div>
      <div id="result-score">0</div>
      <div class="rsub">BLOCKS</div>
      <div id="result-best">Best 0</div>
      <button id="btn-again" class="again">TAP TO RETRY</button>
    </div>
  </div>

  <div id="start">
    <div class="launch">
      <div id="ss-icon">◻<span id="ss-rope"></span></div>
      <div class="name">SWING<span class="dot">·</span>STACK</div>
      <div class="sub">The block <b>swings on a rope</b>.<br/><b>Tap</b> to drop it onto the tower.<br/>Land it dead-center for a <b>PERFECT</b> — the overhang gets sliced off.</div>
      <div class="tap">Tap to start</div>
      <div id="err"></div>
    </div>
    <div id="ver">build v19</div>
  </div>

  <script type="module" src="src/main.js?v=19"></script>
</body>
</html>
