<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#bfe0e8" />
  <title>STICK!</title>
  <link rel="stylesheet" href="styles.css?v=23" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js?v=23",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div id="dist">0<span class="m">m</span></div>
    <div id="best-row">BEST <span id="best">0</span>m</div>
    <div id="combo"></div>
    <div id="flash"></div>
    <!-- power meter (only during wind-up) -->
    <div id="power-wrap"><div id="power-meter"><div id="power-fill"></div></div><div id="power-zone"></div></div>
    <!-- contextual hint -->
    <div id="hint">HOLD to wind up · release to launch</div>
  </div>

  <div id="result" class="hidden">
    <div class="card">
      <div id="result-badge">NICE!</div>
      <div id="result-score">0<span class="m">m</span></div>
      <div id="result-line">0 sticks</div>
      <div id="result-best">Best 0m</div>
      <button id="btn-again" class="again">GO AGAIN</button>
    </div>
  </div>

  <div id="start">
    <div class="launch">
      <div id="guy">🤸</div>
      <div class="name">STICK<span class="bang">!</span></div>
      <div class="sub"><b>Hold</b> to wind up, release to launch.<br/><b>Hold</b> in the air to tuck &amp; flip — let go to open up<br/>and <b>stick the landing</b> feet-first to chain combos &amp; fly further.</div>
      <div class="tap">Tap to start</div>
      <div id="err"></div>
    </div>
    <div id="ver">build v23</div>
  </div>

  <script type="module" src="src/main.js?v=23"></script>
</body>
</html>
