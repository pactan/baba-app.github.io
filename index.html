<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070912" />
  <title>DRIFT CUBE</title>
  <link rel="stylesheet" href="styles.css?v=13" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="vignette"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="top">
      <div class="score-wrap">
        <div id="score">0</div>
        <div class="sub">SCORE</div>
      </div>
      <div class="best-wrap">
        <div id="best">0</div>
        <div class="sub">BEST</div>
      </div>
    </div>

    <div id="combo">
      <span id="combo-mult">x1</span>
      <span id="combo-pending">+0</span>
    </div>
  </div>

  <!-- Touch controls: steer (left) · jump/brake/gas (right) -->
  <div id="controls">
    <div class="steer">
      <button id="btn-left" class="pad" aria-label="Left">◀</button>
      <button id="btn-right" class="pad" aria-label="Right">▶</button>
    </div>
    <div class="drive">
      <button id="btn-jump" class="jump" aria-label="Jump">JUMP</button>
      <div class="pedals">
        <button id="btn-brake" class="brake" aria-label="Brake">BRAKE</button>
        <button id="btn-gas" class="gas" aria-label="Gas">GAS</button>
      </div>
    </div>
  </div>

  <!-- Start overlay -->
  <div id="start">
    <div class="launch">
      <div class="mark">🪵</div>
      <div class="name">DRIFT CUBE</div>
      <div class="sub"><b>GAS</b> to roll, steer at speed to <b>drift</b> — chain slides for combos.<br/><b>JUMP</b> over stuff, smash crates &amp; barrels for points.<br/>Corner too hard while gripping and you'll <b>flip over</b>!</div>
      <div class="tap">Tap to start</div>
      <div id="err"></div>
    </div>
    <div id="ver">build v13</div>
  </div>

  <script type="module" src="src/main.js?v=13"></script>
</body>
</html>
