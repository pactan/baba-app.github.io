<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>DRIFT</title>
  <link rel="stylesheet" href="styles.css?v=6" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="vignette"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="top">
      <div class="score-wrap">
        <div id="score">0</div>
        <div class="sub">SCORE</div>
      </div>
      <div class="time-wrap">
        <div id="time">60.0</div>
        <div class="sub">TIME</div>
      </div>
      <div class="best-wrap">
        <div id="best">0</div>
        <div class="sub">BEST</div>
      </div>
    </div>

    <div id="combo">
      <span id="combo-mult">x1</span>
      <span id="combo-pending">+0</span>
    </div>
  </div>

  <!-- Results overlay -->
  <div id="result" class="hidden">
    <div class="card">
      <div id="result-badge">TIME'S UP</div>
      <div id="result-score">0</div>
      <div class="sub">SCORE</div>
      <div id="result-best">Best 0</div>
      <button id="btn-again" class="again">GO AGAIN</button>
    </div>
  </div>

  <!-- Touch controls -->
  <div id="controls">
    <div class="steer">
      <button id="btn-left" class="pad" aria-label="Left">◀</button>
      <button id="btn-right" class="pad" aria-label="Right">▶</button>
    </div>
    <button id="btn-drift" class="drift" aria-label="Drift">DRIFT</button>
  </div>

  <!-- Start overlay -->
  <div id="start">
    <div class="launch">
      <div class="mark">▢</div>
      <div class="name">DRIFT</div>
      <div class="sub"><b>60 seconds.</b> Drift to score — chain slides for big combos.<br/>Beat the gold <b>ghost</b> of your best run.</div>
      <div class="tap">Tap to start</div>
      <div id="err"></div>
    </div>
    <div id="ver">build v6</div>
  </div>

  <script type="module" src="src/main.js?v=6"></script>
</body>
</html>
