<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10182e" />
  <title>SWING</title>
  <link rel="stylesheet" href="styles.css?v=18" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="vignette"></div>

  <div id="hud">
    <div id="score">0</div>
    <div id="best-row"><span id="best">0</span> <span class="lbl">BEST</span></div>
  </div>

  <div id="hint">HOLD to swing · RELEASE to fly</div>

  <div id="result" class="hidden">
    <div class="card">
      <div id="result-badge">CRASH</div>
      <div id="result-score">0</div>
      <div class="rsub">DISTANCE</div>
      <div id="result-best">Best 0</div>
      <button id="btn-again" class="again">TAP TO RETRY</button>
    </div>
  </div>

  <div id="start">
    <div class="launch">
      <div id="swing-icon">◜◞</div>
      <div class="name">SWING</div>
      <div class="sub"><b>Hold</b> to throw a rope and swing.<br/><b>Let go</b> at the right moment to launch far.<br/>Don't touch the ground. Distance is your score.</div>
      <div class="tap">Tap to start</div>
      <div id="err"></div>
    </div>
    <div id="ver">build v18</div>
  </div>

  <script type="module" src="src/main.js?v=18"></script>
</body>
</html>
