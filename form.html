<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurează Mesajul - Bunicuța</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <a href="index.html" style="text-decoration: none; font-size: 2rem; margin-bottom: 1rem;">⬅️</a>
        <h1>Detaliile Mesajului</h1>
        <p>Completează formularul de mai jos pentru a primi video-ul.</p>

        <div class="card">
            <!-- 
                IMPORTANT: Schimbă 'INSERT_YOUR_EMAIL_HERE' cu adresa ta de email reală 
                pentru a primi datele (ex: contact@domeniu.ro).
                
                Serviciul FormSubmit.co este gratuit și funcționează pe site-uri statice (GitHub Pages).
                Prima dată când testezi, vei primi un email de confirmare pentru a activa formularul.
            -->
            <form id="leadForm" action="https://formsubmit.co/INSERT_YOUR_EMAIL_HERE" method="POST">
                
                <!-- Redirect după trimitere -->
                <input type="hidden" name="_next" value="https://rusub.github.io/baba-app/success.html">
                <!-- Dezactivare captcha pentru conversie mai bună (opțional) -->
                <input type="hidden" name="_captcha" value="false">
                <!-- Subiectul emailului primit -->
                <input type="hidden" name="_subject" value="Lead Nou: Video Bunicuta">

                <div class="form-group">
                    <label for="email">Adresa ta de Email</label>
                    <input type="email" id="email" name="email" placeholder="exemplu@email.com" required>
                    <small style="color: #666; font-size: 0.8rem;">Aici îți voi trimite video-ul final.</small>
                </div>

                <div class="form-group">
                    <label for="friendName">Numele Prietenului (Victima)</label>
                    <input type="text" id="friendName" name="friendName" placeholder="ex: Andrei, Maria..." required>
                </div>

                <div class="form-group">
                    <label for="message">Ce vrei să spună Bunicuța?</label>
                    <textarea id="message" name="message" placeholder="ex: Întreabă-l de ce nu și-a găsit încă prietenă..." required></textarea>
                </div>

                <button type="submit" class="btn">Trimite Comanda</button>
            </form>
        </div>
    </div>

    <footer>
        &copy; 2024 Bunicuța Virală
    </footer>

    <script src="script.js"></script>
</body>
</html>
